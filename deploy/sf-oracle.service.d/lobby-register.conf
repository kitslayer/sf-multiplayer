# Drop-in for sf-oracle.service: register the oracle in the lobby registry so
# the sf-router routes its code (MAIN) to it, and clean up on stop. Non-
# destructive overlay — does not modify the base unit. Install at:
#   /etc/systemd/system/sf-oracle.service.d/lobby-register.conf
[Service]
Environment=SF_LOBBIES_DIR=/tmp/sf-lobbies
ExecStartPost=/home/miles/sf-multiplayer/deploy/register-main-lobby.sh register
ExecStopPost=/home/miles/sf-multiplayer/deploy/register-main-lobby.sh unregister
