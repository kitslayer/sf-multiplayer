# Drop-in for sf-oracle.service — crash containment.
# Install at: /etc/systemd/system/sf-oracle.service.d/restart-daily.conf
#
# The headless oracle crashes deterministically at ~24h02m of uptime (native
# Unity AV at 0x0057ed26 — see notes/CRASH_INVESTIGATION.md). RuntimeMaxSec
# turns that uncontrolled daily crash into a clean restart ~1h inside the
# crash-free window, so players get a predictable ~25s blip instead of a hard
# crash (and, as seen on 2026-06-10, the occasional post-crash WEDGE where the
# process lives but the game loop is dead and Restart=on-failure never fires).
#
# RuntimeMaxSec sends SIGTERM on expiry, which is a CLEAN exit — Restart=on-failure
# would NOT restart after it. So this drop-in also flips Restart=always.
# (sf-oracle-watchdog.timer is the second layer: it restarts on a deaf UDP port,
# which catches the wedge that neither Restart= nor RuntimeMaxSec can see.)
[Service]
RuntimeMaxSec=82800
RuntimeRandomizedExtraSec=600
Restart=always
